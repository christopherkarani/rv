name: dashboard

on:
  pull_request:
    paths: ["dashboard/**", ".github/workflows/dashboard.yml"]
  push:
    branches: [main]
    paths: ["dashboard/**", ".github/workflows/dashboard.yml"]

permissions:
  contents: read

concurrency:
  group: dashboard-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: lint, typecheck, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      # The rule catalog is generated from Sources/; fail if it drifted.
      - run: npm run catalog && git diff --exit-code -- src/lib/catalog.generated.json
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=moderate
