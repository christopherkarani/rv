name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    if: github.event_name != 'pull_request'
    runs-on: macos-26
    timeout-minutes: 120
    outputs:
      signed: ${{ steps.sign.outputs.signed }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache Swift toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Toolchains/swift-6.4-RELEASE.xctoolchain
            ~/Library/Developer/Toolchains/swift-6.4.0-RELEASE.xctoolchain
          key: swift-6.4-RELEASE-${{ runner.os }}-${{ runner.arch }}

      - name: Install Swift 6.4
        run: Scripts/install-official-swift-macos.sh

      # Packages only, not compiled artifacts (see pr.yml: the Metal
      # toolchain cryptex path is random per runner).
      - name: Cache SwiftPM packages
        uses: actions/cache@v4
        with:
          path: |
            .build/checkouts
            ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-pkgs-hook-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.swift-version', 'Package.resolved', 'Package.swift') }}
          restore-keys: |
            swiftpm-pkgs-hook-${{ runner.os }}-${{ runner.arch }}-

      # RVIsolationTests run sharded exactly as in pr.yml: all 598 tests in
      # one process collapse shared-runner throughput (blocking waits
      # saturate the small pool and queueing spirals past any job timeout).
      - name: Preflight + module tests
        run: |
          Scripts/gate.sh \
            RVDomainTests RVEngineTests RVPacksTests RVPolicyTests \
            RVHooksTests RVIPCTests RVPresentationTests \
            RVThemeTests RVTUITests RVHistoryTests RVAnalyticsTests \
            RVCorpusTests
          Scripts/swift-6.4 test --filter 'RVServiceTests|RVCLITests' --skip 'injectedOneSecondIdleFiresWithoutKeepAlive|CHookPipeTests.cHookProof'

      - name: Isolation tests (A-E)
        run: Scripts/swift-6.4 test --skip-build --test-product RVIsolationTests --filter 'RVIsolationTests\.[A-Ea-e]'

      - name: Isolation tests (F-M)
        run: Scripts/swift-6.4 test --skip-build --test-product RVIsolationTests --filter 'RVIsolationTests\.[F-Mf-m]'

      - name: Isolation tests (N-Z)
        run: Scripts/swift-6.4 test --skip-build --test-product RVIsolationTests --filter 'RVIsolationTests\.[N-Zn-z]'

      - name: Stage release binaries
        run: Scripts/release.sh

      # Before the proofs, so they run the hardened, signed binaries.
      # Without the secrets the stage stays unsigned and the dry run shows
      # what would run; repo variable RV_REQUIRE_SIGNED_RELEASE=1 makes
      # missing secrets fail instead.
      - name: Sign and notarize
        id: sign
        env:
          DEVELOPER_ID_APP: ${{ secrets.DEVELOPER_ID_APP }}
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          REQUIRE_SIGNED: ${{ vars.RV_REQUIRE_SIGNED_RELEASE }}
        run: |
          set -euo pipefail
          stage="$GITHUB_WORKSPACE/.build/release-stage"
          if [ -n "$DEVELOPER_ID_APP" ] && [ -n "$MACOS_CERT_P12" ] && [ -n "$MACOS_CERT_PASSWORD" ] \
            && [ -n "$NOTARY_KEY_ID" ] && [ -n "$NOTARY_ISSUER_ID" ] && [ -n "$NOTARY_KEY_P8" ]; then
            Scripts/sign-macos.sh --keychain-from-env "$stage"
            echo "signed=1" >> "$GITHUB_OUTPUT"
          elif [ "$REQUIRE_SIGNED" = "1" ]; then
            echo "::error::RV_REQUIRE_SIGNED_RELEASE=1 but signing secrets are missing"
            exit 1
          else
            echo "::warning::signing secrets are not configured; this release stage is unsigned"
            Scripts/sign-macos.sh --dry-run "$stage"
            echo "signed=0" >> "$GITHUB_OUTPUT"
          fi

      - name: C hook process proof
        env:
          RV_C_HOOK_SKIP_RELEASE: "1"
          RV_RELEASE_STAGE: ${{ github.workspace }}/.build/release-stage
        run: Scripts/c-hook-proof.sh

      - name: Isolated-HOME host attach
        env:
          RV_C_HOOK_SKIP_RELEASE: "1"
          RV_RELEASE_STAGE: ${{ github.workspace }}/.build/release-stage
        run: Scripts/host-attach-proof.sh

      - uses: actions/upload-artifact@v4
        with:
          name: rv-${{ github.ref_name }}
          path: .build/release-stage/
          if-no-files-found: error

      - name: Rename release assets (darwin-arm64)
        run: Scripts/release-assets.sh .build/release-stage release-assets darwin-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets-darwin-arm64
          path: release-assets/
          if-no-files-found: error

  sequoia-smoke:
    name: macos 15 smoke
    runs-on: macos-15
    needs: gate
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: rv-${{ github.ref_name }}
          path: stage

      - name: Load commands are macOS 15
        run: |
          set -euo pipefail
          for bin in stage/rv stage/rv-cli stage/rvd stage/rv-workspace-host; do
            chmod 755 "$bin"
            show="$(vtool -show-build "$bin")"
            printf '%s\n' "$show" | grep -q 'minos 15.0' || {
              printf 'sequoia: %s minos is not 15.0\n%s\n' "$bin" "$show" >&2
              exit 1
            }
          done

      - name: Signature verifies on Sequoia
        if: needs.gate.outputs.signed == '1'
        run: |
          set -euo pipefail
          for bin in stage/rv stage/rv-cli stage/rvd stage/rv-workspace-host stage/rv-pty-claim; do
            codesign --verify --strict --verbose=2 "$bin"
            details="$(codesign -dvv "$bin" 2>&1)"
            case "$details" in
              *"Authority=Developer ID Application:"*"(runtime)"*|*"(runtime)"*"Authority=Developer ID Application:"*) ;;
              *) printf 'sequoia: %s is not hardened Developer ID code\n' "$bin" >&2; exit 1 ;;
            esac
            verdict="$(spctl -a -t open --context context:primary-signature -vv "$bin" 2>&1)" || {
              printf 'sequoia: Gatekeeper rejects %s\n%s\n' "$bin" "$verdict" >&2; exit 1; }
            printf '%s\n' "$verdict" | grep -Fqx -- "$bin: accepted" || {
              printf 'sequoia: Gatekeeper rejects %s\n%s\n' "$bin" "$verdict" >&2; exit 1; }
            printf '%s\n' "$verdict" | grep -Fqx -- "source=Notarized Developer ID" || {
              printf 'sequoia: Gatekeeper rejects %s\n%s\n' "$bin" "$verdict" >&2; exit 1; }
          done
          if [ -f stage/libswiftCompatibilitySpan.dylib ]; then
            codesign --verify --strict --verbose=2 stage/libswiftCompatibilitySpan.dylib
          fi

      - name: Swift binaries load on Sequoia
        run: |
          set -euo pipefail
          stage/rv-cli --help > /tmp/rv-cli-help.txt
          grep -q 'setup' /tmp/rv-cli-help.txt
          stage/rvd --version > /tmp/rvd-version.txt
          grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+' /tmp/rvd-version.txt
          set +e
          stage/rv-workspace-host > /tmp/rv-host-usage.txt 2>&1
          host_status=$?
          set -e
          test "$host_status" -eq 2
          grep -q 'usage: rv-workspace-host --workspace' /tmp/rv-host-usage.txt
          # `rv test` exits 1 on a deny. Robot JSON is rv.test.v1 and does not echo the command.
          set +e
          stage/rv-cli test --robot 'git reset --hard' > /tmp/rv-test.json 2> /tmp/rv-test.err
          test_status=$?
          set -e
          test "$test_status" -eq 0 -o "$test_status" -eq 1
          grep -q 'rv.test.v1' /tmp/rv-test.json
          if grep -E 'Symbol not found|Library not loaded' /tmp/rv-test.err; then
            exit 1
          fi

  linux:
    name: linux ${{ matrix.target }}
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x86_64
          - runner: ubuntu-24.04-arm
            target: linux-aarch64
    steps:
      - uses: actions/checkout@v4

      - name: Cache official Swift Linux tarball
        uses: actions/cache@v4
        with:
          path: ~/.local/share/swift
          key: official-swift-${{ hashFiles('.swift-version') }}-ubuntu24.04-${{ runner.arch }}

      - name: Cache SwiftPM packages
        uses: actions/cache@v4
        with:
          path: |
            .build/checkouts
            ~/.cache/org.swift.swiftpm
          key: swiftpm-pkgs-release-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.swift-version', 'Package.resolved', 'Package.swift') }}
          restore-keys: |
            swiftpm-pkgs-release-${{ runner.os }}-${{ runner.arch }}-

      - name: Tarball runtime deps (not apt swift)
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            binutils gcc git gnupg2 libc6-dev libcurl4-openssl-dev \
            libedit2 libgcc-13-dev libncurses-dev libpython3-dev \
            libsqlite3-0 libsqlite3-dev libstdc++-13-dev libxml2-dev \
            libz3-dev pkg-config tzdata zip unzip zlib1g-dev file
          if dpkg-query -W -f='${Status}\n' swift swiftlang 2>/dev/null \
            | grep -q 'install ok installed'; then
            printf 'release: apt swift/swiftlang is present; refuse\n' >&2
            exit 1
          fi

      - name: Install official Swift 6.4 Linux tarball
        run: |
          bin="$(Scripts/install-official-swift-linux.sh --print-bin)"
          echo "$bin" >> "$GITHUB_PATH"
          echo "Official tarball bin: $bin"

      - name: Confirm official Swift 6.4
        run: |
          swift --version
          pin="$(tr -d '[:space:]' < .swift-version)"
          swift --version | head -n 1 | grep -Eq "Swift version ${pin}( |$)"

      - name: Stage release binaries
        run: Scripts/release.sh

      - name: Linux stage smoke
        run: |
          set -euo pipefail
          stage=.build/release-stage
          for bin in rv rv-cli rvd rv-workspace-host rv-isolation-exec; do
            file "$stage/$bin"
            file "$stage/$bin" | grep -q 'ELF'
            case "${{ matrix.target }}" in
              linux-x86_64) file "$stage/$bin" | grep -q 'x86-64' ;;
              linux-aarch64) file "$stage/$bin" | grep -q 'ARM aarch64' ;;
            esac
          done
          "$stage/rv-cli" --help > /tmp/rv-cli-help.txt
          grep -q 'setup' /tmp/rv-cli-help.txt
          "$stage/rvd" --version > /tmp/rvd-version.txt
          grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+' /tmp/rvd-version.txt
          # No daemon beside the stage: the hook fails closed with a deny.
          tmp_run="$(mktemp -d)"
          printf '%s' '{"tool_name":"Bash","tool_input":{"command":"ls"}}' \
            | HOME=/tmp XDG_RUNTIME_DIR="$tmp_run" "$stage/rv" hook --host claude > /tmp/hook-out.json
          grep -q 'deny' /tmp/hook-out.json

      - name: Rename release assets
        run: Scripts/release-assets.sh .build/release-stage release-assets ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.target }}
          path: release-assets/
          if-no-files-found: error

  install-smoke:
    name: install smoke (${{ matrix.asset }})
    needs: [gate, linux]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            asset: darwin-arm64
          - runner: ubuntu-24.04
            asset: linux-x86_64
          - runner: ubuntu-24.04-arm
            asset: linux-aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release-assets-${{ matrix.asset }}
          path: assets

      # The exact install.sh that publish will attach, against the exact
      # renamed assets, on every target: a verifier/asset mismatch fails
      # the release before anything is published.
      - name: One-line install smoke
        run: sh Scripts/install-smoke.sh --local install.sh assets

  publish:
    name: publish release
    if: github.event_name == 'push'
    needs: [gate, sequoia-smoke, linux, install-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          path: assets
          merge-multiple: true

      - name: Attach install script and checksums
        run: |
          set -euo pipefail
          cp install.sh assets/install.sh
          (cd assets && sha256sum -- * > SHA256SUMS)
          ls -l assets

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" assets/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" assets/* \
              --title "$GITHUB_REF_NAME" --generate-notes
          fi

  curl-e2e:
    name: curl install e2e (${{ matrix.asset }})
    needs: [publish]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            asset: darwin-arm64
          - runner: ubuntu-24.04
            asset: linux-x86_64
          - runner: ubuntu-24.04-arm
            asset: linux-aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      # Backstop behind install-smoke: the real public URL, including the
      # rykanv.com redirect and latest/download resolution, minutes after
      # publish. Fails the workflow visibly if the live path regressed.
      - name: Live one-line install
        run: sh Scripts/install-smoke.sh --live https://rykanv.com/install
