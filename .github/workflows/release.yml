name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    if: github.event_name != 'pull_request'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Cache Swift toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Toolchains/swift-6.4-RELEASE.xctoolchain
            ~/Library/Developer/Toolchains/swift-6.4.0-RELEASE.xctoolchain
          key: swift-6.4-RELEASE-${{ runner.os }}-${{ runner.arch }}

      - name: Install Swift 6.4
        run: tools/install-official-swift-macos.sh

      - name: Preflight + module tests
        run: |
          tools/gate.sh \
            RVDomainTests RVEngineTests RVPacksTests RVPolicyTests \
            RVHooksTests RVIPCTests RVPresentationTests \
            RVThemeTests RVTUITests RVHistoryTests RVAnalyticsTests \
            RVCorpusTests
          tools/swift-6.4 test --filter RVServiceTests --skip injectedOneSecondIdleFiresWithoutKeepAlive
          tools/swift-6.4 test --filter RVCLITests --skip CHookPipeTests.cHookProof

      - name: Stage release binaries
        run: tools/release.sh

      - name: C hook process proof
        env:
          RV_C_HOOK_SKIP_RELEASE: "1"
          RV_RELEASE_STAGE: ${{ github.workspace }}/.build/release-stage
        run: tools/c-hook-proof.sh

      - name: Isolated-HOME host attach
        env:
          RV_C_HOOK_SKIP_RELEASE: "1"
          RV_RELEASE_STAGE: ${{ github.workspace }}/.build/release-stage
        run: tools/host-attach-proof.sh

      - uses: actions/upload-artifact@v4
        with:
          name: rv-${{ github.ref_name }}
          path: |
            .build/release-stage/rv
            .build/release-stage/rv-cli
            .build/release-stage/rvd
            .build/release-stage/*_RVPacks.bundle
          if-no-files-found: error
