name: linux-kernel-e2e

# rv-isolation-exec's Landlock boundary on pinned guest kernels, not just the
# runner's kernel (pr.yml measures that one). Informational: not a required
# check. See docs/linux-kernel-e2e.md.

on:
  pull_request:
    paths:
      - Sources/RVIsolation/landlock_apply.c
      - Sources/RVIsolation/include/rv_landlock_apply.h
      - Sources/rv-isolation-exec/**
      - Scripts/linux-kernel-e2e.sh
      - Scripts/linux-kernel-e2e/**
      - .github/workflows/linux-kernel-e2e.yml
  push:
    branches: [main]
    paths:
      - Sources/RVIsolation/landlock_apply.c
      - Sources/RVIsolation/include/rv_landlock_apply.h
      - Sources/rv-isolation-exec/**
      - Scripts/linux-kernel-e2e.sh
      - Scripts/linux-kernel-e2e/**
      - .github/workflows/linux-kernel-e2e.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-kernel-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kernel:
    name: kernel ${{ matrix.lane }} (Landlock ABI ${{ matrix.abi }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: "5.10"
            abi: none
          - lane: "6.1"
            abi: 2
          - lane: "6.6"
            abi: 3
          - lane: "6.12"
            abi: 6
    steps:
      - uses: actions/checkout@v4

      # Keyed on the pins; the script re-verifies SHA-256 on every use.
      - name: Cache guest kernel
        uses: actions/cache@v4
        with:
          path: ~/.cache/rv-kernel-e2e
          key: rv-kernel-e2e-${{ matrix.lane }}-${{ hashFiles('Scripts/linux-kernel-e2e/kernels.tsv') }}

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            qemu-system-x86 cpio binutils gcc libc6-dev

      # Hosted runners expose /dev/kvm root-only; the script falls back to
      # TCG when it stays unusable.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || true

      - name: Boot kernel ${{ matrix.lane }} and run the e2e
        run: Scripts/linux-kernel-e2e.sh ${{ matrix.lane }}
