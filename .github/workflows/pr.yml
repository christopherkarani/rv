name: pr

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Extra hygiene only. Not the Swift gate (OPE-263).
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: Scripts/preflight.sh --quiet

  # Gate: official Swift 6.4 Linux tarball, then unfiltered `swift test`.
  # Not apt swift. Not Scripts/gate.sh --filter. Not swift test --filter
  # (SPM --filter still typechecks everything unless --target is used).
  test:
    name: swift test
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Cache official Swift Linux tarball
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/swift
            ~/.cache/swift
          key: official-swift-${{ hashFiles('.swift-version') }}-ubuntu24.04-${{ runner.arch }}

      - name: Tarball runtime deps (not apt swift)
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            binutils \
            git \
            gnupg2 \
            libc6-dev \
            libcurl4-openssl-dev \
            libedit2 \
            libgcc-13-dev \
            libncurses-dev \
            libpython3-dev \
            libsqlite3-0 \
            libsqlite3-dev \
            libstdc++-13-dev \
            libxml2-dev \
            libz3-dev \
            pkg-config \
            tzdata \
            zip \
            unzip \
            zlib1g-dev
          if dpkg-query -W -f='${Status}\n' swift swiftlang 2>/dev/null \
            | grep -q 'install ok installed'; then
            printf 'pr: apt swift/swiftlang is present; refuse\n' >&2
            exit 1
          fi

      - name: Install official Swift 6.4 Linux tarball
        run: |
          bin="$(Scripts/install-official-swift-linux.sh --print-bin)"
          echo "$bin" >> "$GITHUB_PATH"
          echo "Official tarball bin: $bin"

      - name: Confirm official Swift 6.4
        run: |
          echo "swift=$(command -v swift)"
          swift --version
          pin="$(tr -d '[:space:]' < .swift-version)"
          swift --version | head -n 1 | grep -Eq "Swift version ${pin}( |$)"
          case "$(command -v swift)" in
            */.local/share/swift/swift-*-RELEASE-*/usr/bin/swift) ;;
            *)
              echo "swift is not the official tarball install" >&2
              exit 1
              ;;
          esac

      - name: Swift tests
        run: swift test

      - name: C hook units
        run: Sources/rv-c/tests/run.sh

      - name: Isolated-HOME host attach
        run: Scripts/host-attach-proof.sh

  # Compiler host is macos-26. Advertised Darwin floor is macOS 15.
  # sequoia-smoke executes the staged binaries; it does not compile Swift.
  hook-grade:
    name: macos hook grade
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Cache Swift toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Toolchains/swift-6.4-RELEASE.xctoolchain
            ~/Library/Developer/Toolchains/swift-6.4.0-RELEASE.xctoolchain
          key: swift-6.4-RELEASE-${{ runner.os }}-${{ runner.arch }}

      - name: Install Swift 6.4
        run: Scripts/install-official-swift-macos.sh

      - name: C hook units
        run: Sources/rv-c/tests/run.sh

      - name: Stage release binaries
        run: Scripts/release.sh

      - name: C hook process proof
        env:
          RV_C_HOOK_SKIP_RELEASE: "1"
          RV_RELEASE_STAGE: ${{ github.workspace }}/.build/release-stage
        run: Scripts/c-hook-proof.sh

      # Linux PR already ran unfiltered swift test. Darwin XPC / LaunchAgent
      # and the isolated-HOME oracle only exist here. Skip the in-process
      # CHookPipeTests proof — this job already ran Scripts/c-hook-proof.sh.
      - name: Darwin Swift (XPC / CLI)
        run: |
          Scripts/swift-6.4 test --filter RVServiceTests --skip injectedOneSecondIdleFiresWithoutKeepAlive
          Scripts/swift-6.4 test --filter RVCLITests --skip CHookPipeTests.cHookProof
          Scripts/swift-6.4 test --filter RVIsolationTests

      - name: Isolated-HOME oracle
        run: Scripts/host-oracle.sh

      - name: Isolated-HOME host attach
        env:
          RV_C_HOOK_SKIP_RELEASE: "1"
          RV_RELEASE_STAGE: ${{ github.workspace }}/.build/release-stage
        run: Scripts/host-attach-proof.sh

      - uses: actions/upload-artifact@v4
        with:
          name: rv-macos-stage
          path: |
            .build/release-stage/rv
            .build/release-stage/rv-cli
            .build/release-stage/rvd
            .build/release-stage/rv-workspace-host
            .build/release-stage/*_RVPacks.bundle
          if-no-files-found: error

  sequoia-smoke:
    name: macos 15 smoke
    runs-on: macos-15
    needs: hook-grade
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: rv-macos-stage
          path: stage

      - name: Load commands are macOS 15
        run: |
          set -euo pipefail
          for bin in stage/rv stage/rv-cli stage/rvd stage/rv-workspace-host; do
            chmod 755 "$bin"
            show="$(vtool -show-build "$bin")"
            printf '%s\n' "$show" | grep -q 'minos 15.0' || {
              printf 'sequoia: %s minos is not 15.0\n%s\n' "$bin" "$show" >&2
              exit 1
            }
          done

      - name: Swift binaries load on Sequoia
        run: |
          set -euo pipefail
          stage/rv-cli --help > /tmp/rv-cli-help.txt
          grep -q 'setup' /tmp/rv-cli-help.txt
          stage/rvd --version > /tmp/rvd-version.txt
          grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+' /tmp/rvd-version.txt
          set +e
          stage/rv-workspace-host > /tmp/rv-host-usage.txt 2>&1
          host_status=$?
          set -e
          test "$host_status" -eq 2
          grep -q 'usage: rv-workspace-host --workspace' /tmp/rv-host-usage.txt
          # `rv test` exits 1 on a deny. Robot JSON is rv.test.v1 and does not echo the command.
          set +e
          stage/rv-cli test --robot 'git reset --hard' > /tmp/rv-test.json 2> /tmp/rv-test.err
          test_status=$?
          set -e
          test "$test_status" -eq 0 -o "$test_status" -eq 1
          grep -q 'rv.test.v1' /tmp/rv-test.json
          if grep -E 'Symbol not found|Library not loaded' /tmp/rv-test.err; then
            exit 1
          fi

      - name: C units on the Sequoia clang
        run: Sources/rv-c/tests/run.sh
