name: pr

on:
  pull_request:
  # Merged state gets the same gate: a PR can be green on its own base and
  # still break once combined with another merge.
  push:
    branches: [main]

permissions:
  contents: read

# PR runs supersede each other. Main runs never cancel a running one, so
# every merge that starts gets a verdict; GitHub keeps only the newest
# pending main run queued behind it.
concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Extra hygiene only. Not the Swift gate (OPE-263).
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: Scripts/preflight.sh --quiet

  # Gate: official Swift 6.4 Linux tarball, then unfiltered `swift test`.
  # Not apt swift. Not Scripts/gate.sh --filter. Not swift test --filter
  # (SPM --filter still typechecks everything unless --target is used).
  test:
    name: swift test
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Cache official Swift Linux tarball
        uses: actions/cache@v4
        with:
          # Extracted toolchain only. The tarball in ~/.cache/swift is
          # re-downloaded on a miss; caching it doubles the entry for no gain.
          path: ~/.local/share/swift
          key: official-swift-${{ hashFiles('.swift-version') }}-ubuntu24.04-${{ runner.arch }}

      # Restore-only on PRs. Main saves a fresh entry per merge (save step
      # at the end of this job): a key without the commit was written once
      # and never again, so every PR rebuilt everything since that day.
      - name: Restore SwiftPM build
        id: swiftpm-build
        uses: actions/cache/restore@v4
        with:
          path: |
            .build
            ~/.cache/org.swift.swiftpm
          key: swiftpm-test-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.swift-version', 'Package.resolved', 'Package.swift') }}-${{ github.sha }}
          restore-keys: |
            swiftpm-test-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.swift-version', 'Package.resolved', 'Package.swift') }}-
            swiftpm-test-${{ runner.os }}-${{ runner.arch }}-

      # InstallScriptTests mount codesign/spctl shims over /usr/bin and
      # /usr/sbin inside an unprivileged user namespace; Ubuntu 24.04
      # runners restrict those by default (uid_map write fails).
      - name: Allow unprivileged user namespaces for test shims
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Tarball runtime deps (not apt swift)
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            binutils \
            gcc \
            git \
            gnupg2 \
            libc6-dev \
            libcurl4-openssl-dev \
            libedit2 \
            libgcc-13-dev \
            libncurses-dev \
            libpython3-dev \
            libsqlite3-0 \
            libsqlite3-dev \
            libstdc++-13-dev \
            libxml2-dev \
            libz3-dev \
            pkg-config \
            tzdata \
            zip \
            unzip \
            zlib1g-dev
          if dpkg-query -W -f='${Status}\n' swift swiftlang 2>/dev/null \
            | grep -q 'install ok installed'; then
            printf 'pr: apt swift/swiftlang is present; refuse\n' >&2
            exit 1
          fi

      - name: Install official Swift 6.4 Linux tarball
        run: |
          bin="$(Scripts/install-official-swift-linux.sh --print-bin)"
          echo "$bin" >> "$GITHUB_PATH"
          echo "Official tarball bin: $bin"

      - name: Confirm official Swift 6.4
        run: |
          echo "swift=$(command -v swift)"
          swift --version
          pin="$(tr -d '[:space:]' < .swift-version)"
          swift --version | head -n 1 | grep -Eq "Swift version ${pin}( |$)"
          case "$(command -v swift)" in
            */.local/share/swift/swift-*-RELEASE-*/usr/bin/swift) ;;
            *)
              echo "swift is not the official tarball install" >&2
              exit 1
              ;;
          esac

      # Tests must not touch the developer's real rv config. `workspaces/` is
      # the one known leak (IsolationApply resolves the workspace home from
      # the process HOME; injecting it waits on impro-ref, PLAN 6.5).
      - name: Fingerprint ~/.config/rv before tests
        run: python3 Scripts/config-dir-fingerprint.py "$HOME/.config/rv" --ignore workspaces > "$RUNNER_TEMP/config-rv.before"

      # T8 ABI gate (Item 5): measure the runner kernel's Landlock ABI with
      # the same VERSION probe the C shim uses
      # (`Sources/RVIsolation/landlock_apply.c:104`), then run the suite on
      # the measured kernel. OpenShell requires ABI v3+ in either startup
      # mode and fails to start under `hard_requirement`
      # (https://docs.nvidia.com/openshell/latest/how-it-works/policies/schema);
      # rv pins that fail-to-start shape per ABI regime in
      # LandlockContainmentTests instead of assuming one ABI. The probe is
      # header-independent (numeric __NR 444 + flags 1, the same fallback
      # `landlock_apply.c` carries), so a missing <linux/landlock.h> cannot
      # silently unmeasure the run; its presence is recorded for diagnostics
      # only. Fail closed: an unbuildable, unrunnable, or unparseable probe
      # stops the job before `swift test`.
      - name: Probe Landlock ABI
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/rv-landlock-abi-probe.c" <<'EOF'
          #include <errno.h>
          #include <stddef.h>
          #include <stdio.h>
          #include <sys/syscall.h>
          #include <unistd.h>
          #ifndef SYS_landlock_create_ruleset
          #define SYS_landlock_create_ruleset 444
          #endif
          #define RV_ABI_VERSION 1u
          int main(void) {
              long abi;
              errno = 0;
              abi = syscall(SYS_landlock_create_ruleset, NULL, (size_t)0, RV_ABI_VERSION);
              printf("abi=%ld errno=%d\n", abi, abi < 0 ? errno : 0);
              return 0;
          }
          EOF
          cc -O2 -Wall -Wextra -Werror "$RUNNER_TEMP/rv-landlock-abi-probe.c" \
              -o "$RUNNER_TEMP/rv-landlock-abi-probe"
          probe="$("$RUNNER_TEMP/rv-landlock-abi-probe")"
          echo "landlock probe: $probe"
          abi="${probe%% errno=*}"
          abi="${abi#abi=}"
          case "$abi" in
            ''|*[!0-9-]*) echo "probe printed unparseable abi: $probe" >&2; exit 1 ;;
          esac
          echo "RV_LANDLOCK_ABI=$abi" >> "$GITHUB_ENV"
          if echo '#include <linux/landlock.h>' | cc -E - > /dev/null 2>&1; then
            header=present
          else
            header=absent
          fi
          {
            echo "### Landlock ABI gate (T8)"
            echo ""
            echo "- kernel: \`$(uname -r)\` (\`$(uname -m)\`)"
            echo "- measured: \`$probe\`"
            echo "- linux/landlock.h: \`$header\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # The run prints tens of thousands of lines; a failure is said again
      # at the end, where the log API and a truncated viewer still show it.
      - name: Swift tests
        run: |
          set -o pipefail
          if ! swift test 2>&1 | tee "$RUNNER_TEMP/swift-test.log"; then
            Scripts/ci-test-failures.sh 'swift test' "$RUNNER_TEMP/swift-test.log"
            exit 1
          fi

      - name: ~/.config/rv untouched by swift test
        run: |
          python3 Scripts/config-dir-fingerprint.py "$HOME/.config/rv" --ignore workspaces > "$RUNNER_TEMP/config-rv.after"
          if ! diff -u "$RUNNER_TEMP/config-rv.before" "$RUNNER_TEMP/config-rv.after"; then
            echo "::error::swift test changed ~/.config/rv (diff above)"
            exit 1
          fi

      # A normal debug build must not carry the test owner presence
      # (docs/security/test-owner-presence.md); release.sh checks its stage.
      - name: No test owner presence in the debug products
        run: Scripts/check-no-test-owner-presence.sh .build/debug/rv .build/debug/rvd .build/debug/rv-workspace-host

      # And the guard must catch what it guards against: a debug rvd built
      # with RV_TEST_OWNER_PRESENCE=1, in a scratch path of its own so it
      # never replaces the binaries above. Only rvd: the markers are in
      # RVService, which rvd links, and a second debug build of the whole
      # package would double the job.
      - name: Guard refuses a test-owner-presence rvd
        run: |
          set -euo pipefail
          RV_TEST_OWNER_PRESENCE=1 swift build --scratch-path .build/top --product rvd
          .build/top/debug/rvd --version | grep -q '(rv-test-owner-presence build)$'
          if Scripts/check-no-test-owner-presence.sh .build/top/debug/rvd; then
            echo "::error::check-no-test-owner-presence.sh passed an rvd built with RV_TEST_OWNER_PRESENCE=1"
            exit 1
          fi

      - name: C hook units
        run: Sources/rv-c/tests/run.sh

      - name: Isolated-HOME host attach
        run: Scripts/host-attach-proof.sh

      # Live SDK integration against the debug rvd built above (Python floor).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Python SDK integration (Linux)
        env:
          RV_RVD: ${{ github.workspace }}/.build/debug/rvd
        run: |
          python -m pip install -e "./sdk/python[test]"
          python -m pytest sdk/python/tests -m integration -q

      # Main only, whatever the tests said: the build is still good to
      # restore. .build/top is the throwaway test-owner-presence rvd.
      - name: Drop the scratch rvd build (main)
        if: ${{ !cancelled() && github.event_name == 'push' }}
        run: rm -rf .build/top

      - name: Save SwiftPM build
        if: ${{ !cancelled() && github.event_name == 'push' }}
        uses: actions/cache/save@v4
        with:
          path: |
            .build
            ~/.cache/org.swift.swiftpm
          key: ${{ steps.swiftpm-build.outputs.cache-primary-key }}

  # Linux checks that need root on a real VM (the hosted container images
  # cannot remount /proc, load an AppArmor profile or change Yama). Each
  # step runs code the `swift test` job also builds; RV_LINUX_PEER_STRICT=1
  # turns "this host cannot do that" into a failure, so nothing here passes
  # by skipping.
  linux-root:
    name: linux root e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Cache official Swift Linux tarball
        uses: actions/cache@v4
        with:
          path: ~/.local/share/swift
          key: official-swift-${{ hashFiles('.swift-version') }}-ubuntu24.04-${{ runner.arch }}

      # Restore-only on PRs. Main saves a fresh entry per merge (save step
      # at the end of this job): a key without the commit was written once
      # and never again, so every PR rebuilt everything since that day.
      - name: Restore SwiftPM build
        id: swiftpm-build
        uses: actions/cache/restore@v4
        with:
          path: |
            .build
            ~/.cache/org.swift.swiftpm
          key: swiftpm-root-e2e-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.swift-version', 'Package.resolved', 'Package.swift') }}-${{ github.sha }}
          restore-keys: |
            swiftpm-root-e2e-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.swift-version', 'Package.resolved', 'Package.swift') }}-
            swiftpm-root-e2e-${{ runner.os }}-${{ runner.arch }}-

      - name: Tarball runtime deps (not apt swift)
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            apparmor-utils binutils gcc git gnupg2 libc6-dev libcurl4-openssl-dev libedit2 \
            python3-venv \
            libgcc-13-dev libncurses-dev libpython3-dev libsqlite3-0 libsqlite3-dev \
            libstdc++-13-dev libxml2-dev libz3-dev pkg-config tzdata zip unzip zlib1g-dev

      - name: Install official Swift 6.4 Linux tarball
        run: |
          bin="$(Scripts/install-official-swift-linux.sh --print-bin)"
          echo "$bin" >> "$GITHUB_PATH"

      - name: Build tests
        run: swift build --build-tests

      - name: Host facts
        run: |
          {
            echo "### linux root e2e host"
            echo ""
            echo "- kernel: \`$(uname -r)\` (\`$(uname -m)\`)"
            echo "- LSMs: \`$(cat /sys/kernel/security/lsm 2>/dev/null || echo unknown)\`"
            echo "- yama ptrace_scope: \`$(cat /proc/sys/kernel/yama/ptrace_scope 2>/dev/null || echo none)\`"
            echo "- /proc mount: \`$(grep ' /proc ' /proc/self/mountinfo | tail -n 1)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # Each step below runs whether or not the one before it passed (a
      # failed step still fails the job), so one failure does not hide the next.
      # Real MCP servers in the cage, as the runner's own user: a
      # Node server fetched by npx through the allowlist proxy and a Python
      # server off the network (docs/security/mcp-linux-sandbox.md).
      - name: MCP sandbox with real Node and Python servers
        if: ${{ !cancelled() }}
        env:
          RV_MCP_REAL_SERVERS: "1"
        run: |
          Scripts/require-tests-ran.sh --self-test
          Scripts/require-tests-ran.sh --no-skips 2 timeout 900 swift test --skip-build \
            --filter 'aNodeServerStartedWithNpxRunsInTheCage|aPythonServerRunsInTheCage'

      # Root runs the built bundle from the runner's checkout; HOME=/root
      # keeps it away from the runner's configuration. SwiftPM's lock files
      # in /tmp belong to the runner, and the kernel does not let root
      # reopen another user's file in a sticky directory.
      - name: Secrets gateway peer binding as root (strict)
        if: ${{ !cancelled() }}
        run: |
          sudo git config --global --add safe.directory "$GITHUB_WORKSPACE"
          sudo find /tmp -maxdepth 1 -name '*.build*.lock' -delete
          sudo env "PATH=$PATH" HOME=/root RV_LINUX_PEER_STRICT=1 \
            Scripts/require-tests-ran.sh --suites 6 100 timeout 900 swift test --skip-build \
            --filter 'ProcFS|GatewayPeerBindingTests|SecretGatewayLinuxPeerTests|SecretGatewayLinuxAttackTests'

      # The two tests that need root, by name and with no skip allowed;
      # then what `swift test` ran as the runner, now with every capability.
      - name: MCP sandbox and rv run as root
        if: ${{ !cancelled() }}
        run: |
          sudo env "PATH=$PATH" HOME=/root \
            Scripts/require-tests-ran.sh --no-skips 2 timeout 900 swift test --skip-build \
            --filter 'aSetuidBinaryGivesTheServerNoPrivileges|aLauncherStartedByPidOneStopsAndRuns'
          sudo env "PATH=$PATH" HOME=/root \
            Scripts/require-tests-ran.sh --suites 3 70 timeout 900 swift test --skip-build \
            --filter 'MCPLinuxSandboxTests|MCPLinuxCageTests|SecretRunLaunchTests'

      # rv run with a real HTTPS request: a throwaway account, a TLS
      # upstream on localhost, a private mount namespace for its CA.
      - name: rv run, end to end with a real HTTPS request
        if: ${{ !cancelled() }}
        run: sudo env "PATH=$PATH" Scripts/linux-rv-run-e2e.sh

      # The approvals custodian for real: installed with systemd through
      # `rv mcp custodian install`, a throwaway account with a password,
      # PAM, the gateway, an approval, a replayed grant, a rolled-back
      # mcp.json, then uninstalled (docs/security/mcp-linux-custodian.md).
      - name: MCP approvals custodian, installed and driven end to end
        if: ${{ !cancelled() }}
        run: |
          test -d /run/systemd/system
          sudo apt-get install -y --no-install-recommends patchelf
          sudo env "PATH=$PATH" Scripts/linux-custodian-e2e.sh

      # Last: ptrace_scope=3 cannot be undone on a running kernel.
      - name: Secrets gateway peer binding under hidepid, pid namespaces, no CAP_SYS_PTRACE, AppArmor, Docker, Yama
        if: ${{ !cancelled() }}
        run: |
          sudo env "PATH=$PATH" HOME=/root RV_LINUX_PEER_STRICT=1 RV_YAMA_IRREVERSIBLE=1 \
            Scripts/linux-peer-binding-e2e.sh

      # Main only. The root steps leave root-owned files in .build; hand
      # them back to the runner so the cache can read them.
      - name: Own .build again (main)
        if: ${{ !cancelled() && github.event_name == 'push' }}
        run: sudo chown -R "$(id -u):$(id -g)" .build

      - name: Save SwiftPM build
        if: ${{ !cancelled() && github.event_name == 'push' }}
        uses: actions/cache/save@v4
        with:
          path: |
            .build
            ~/.cache/org.swift.swiftpm
          key: ${{ steps.swiftpm-build.outputs.cache-primary-key }}


  # The one macOS job on PRs: Darwin XPC / LaunchAgent / CLI paths that
  # Linux `swift test` cannot reach. Debug build only, no release staging.
  # Isolation, MCP, the release-staged hook grade, the macOS 15 smoke and
  # the micro-VM backend run in macos-full.yml (nightly, `ci:full` label,
  # or by hand). One job per push keeps PRs off the macOS runner queue.
  macos-essentials:
    name: macos essentials
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Cache Swift toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Toolchains/swift-6.4-RELEASE.xctoolchain
            ~/Library/Developer/Toolchains/swift-6.4.0-RELEASE.xctoolchain
          key: swift-6.4-RELEASE-${{ runner.os }}-${{ runner.arch }}

      - name: Install Swift 6.4
        run: Scripts/install-official-swift-macos.sh

      # Packages only, not compiled artifacts: a restored build plan embeds
      # the Metal toolchain cryptex path, which is random per runner, so an
      # incremental rebuild fails spawning `metal` (SwiftTerm shaders).
      - name: Cache SwiftPM packages
        uses: actions/cache@v4
        with:
          path: |
            .build/checkouts
            ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-pkgs-hook-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.swift-version', 'Package.resolved', 'Package.swift') }}
          restore-keys: |
            swiftpm-pkgs-hook-${{ runner.os }}-${{ runner.arch }}-

      - name: C hook units
        run: Sources/rv-c/tests/run.sh

      - name: Build Darwin test products
        run: Scripts/swift-6.4 build --build-tests

      # One --skip-build run per test product under the watchdog (see
      # Scripts/ci-watchdog.sh): a stalled product is named, sampled and
      # killed instead of eating the job timeout. Both products run even
      # if the first fails. CHookPipeTests.cHookProof needs staged release
      # binaries, which only macos-full builds.
      - name: Darwin Swift (XPC / CLI)
        run: |
          set -o pipefail
          skip='injectedOneSecondIdleFiresWithoutKeepAlive|CHookPipeTests.cHookProof'
          failed=''
          for product in RVServiceTests RVCLITests; do
            printf '== %s\n' "$product"
            if ! Scripts/ci-watchdog.sh 600 Scripts/swift-6.4 test --skip-build \
              --test-product "$product" --filter "$product" --skip "$skip" 2>&1 \
              | tee "$RUNNER_TEMP/darwin-swift-$product.log"; then
              failed="$failed $product"
            fi
          done
          for product in $failed; do
            Scripts/ci-test-failures.sh "$product" "$RUNNER_TEMP/darwin-swift-$product.log"
          done
          [ -z "$failed" ]

      # A test process killed by a signal (e.g. SIGBUS) leaves only
      # "unexpected signal code N" in the log. Keep the Darwin crash
      # reports so the faulting thread and frame are visible.
      - name: Collect crash reports
        if: failure()
        run: |
          sleep 15
          dest="$RUNNER_TEMP/crash-reports"
          mkdir -p "$dest"
          find "$HOME/Library/Logs/DiagnosticReports" -maxdepth 1 -type f \
            \( -name '*.ips' -o -name '*.crash' \) -mmin -180 \
            -exec cp {} "$dest/" \; 2>/dev/null || true
          ls -l "$dest"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: crash-reports-${{ github.job }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/crash-reports/
          if-no-files-found: ignore
          retention-days: 14
