name: pr

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Extra hygiene only. Not the Swift gate (OPE-263).
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: tools/preflight.sh --quiet

  # Gate: official Swift 6.4 Linux tarball, then unfiltered `swift test`.
  # Not apt swift. Not tools/gate.sh --filter. Not swift test --filter
  # (SPM --filter still typechecks everything unless --target is used).
  test:
    name: swift test
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Cache official Swift Linux tarball
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/swift
            ~/.cache/swift
          key: official-swift-${{ hashFiles('.swift-version') }}-ubuntu24.04-${{ runner.arch }}

      - name: Tarball runtime deps (not apt swift)
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            binutils \
            git \
            gnupg2 \
            libc6-dev \
            libcurl4-openssl-dev \
            libedit2 \
            libgcc-13-dev \
            libncurses-dev \
            libpython3-dev \
            libsqlite3-0 \
            libsqlite3-dev \
            libstdc++-13-dev \
            libxml2-dev \
            libz3-dev \
            pkg-config \
            tzdata \
            zip \
            unzip \
            zlib1g-dev
          if dpkg-query -W -f='${Status}\n' swift swiftlang 2>/dev/null \
            | grep -q 'install ok installed'; then
            printf 'pr: apt swift/swiftlang is present; refuse\n' >&2
            exit 1
          fi

      - name: Install official Swift 6.4 Linux tarball
        run: |
          bin="$(tools/install-official-swift-linux.sh --print-bin)"
          echo "$bin" >> "$GITHUB_PATH"
          echo "Official tarball bin: $bin"

      - name: Confirm official Swift 6.4
        run: |
          echo "swift=$(command -v swift)"
          swift --version
          pin="$(tr -d '[:space:]' < .swift-version)"
          swift --version | head -n 1 | grep -Eq "Swift version ${pin}( |$)"
          case "$(command -v swift)" in
            */.local/share/swift/swift-*-RELEASE-*/usr/bin/swift) ;;
            *)
              echo "swift is not the official tarball install" >&2
              exit 1
              ;;
          esac

      - name: Swift tests
        run: swift test

      - name: C hook units
        run: Sources/rv-c/tests/run.sh

      - name: Isolated-HOME host attach
        run: tools/host-attach-proof.sh

  # Advertised grade is macOS 26 hook process, not Linux units.
  hook-grade:
    name: macos hook grade
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Cache Swift toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Toolchains/swift-6.4-RELEASE.xctoolchain
            ~/Library/Developer/Toolchains/swift-6.4.0-RELEASE.xctoolchain
          key: swift-6.4-RELEASE-${{ runner.os }}-${{ runner.arch }}

      - name: Install Swift 6.4
        run: |
          pin="$(tr -d '[:space:]' < .swift-version)"
          dest="$HOME/Library/Developer/Toolchains/swift-${pin}-RELEASE.xctoolchain"
          dest0="$HOME/Library/Developer/Toolchains/swift-${pin}.0-RELEASE.xctoolchain"
          if [[ -x "$dest/usr/bin/swift" || -x "$dest0/usr/bin/swift" ]]; then
            exit 0
          fi
          pkg="swift-${pin}-RELEASE-osx.pkg"
          curl -fsSL -o "$pkg" \
            "https://download.swift.org/swift-${pin}-release/xcode/swift-${pin}-RELEASE/${pkg}"
          sudo installer -pkg "$pkg" -target /
          mkdir -p "$HOME/Library/Developer/Toolchains"
          for sys in \
            "/Library/Developer/Toolchains/swift-${pin}-RELEASE.xctoolchain" \
            "/Library/Developer/Toolchains/swift-${pin}.0-RELEASE.xctoolchain"; do
            home_dest="$HOME/Library/Developer/Toolchains/$(basename "$sys")"
            if [[ ! -x "$home_dest/usr/bin/swift" && -x "$sys/usr/bin/swift" ]]; then
              rm -f "$home_dest"
              cp -R "$sys" "$home_dest"
            fi
          done

      - name: C hook units
        run: Sources/rv-c/tests/run.sh

      - name: Stage release binaries
        run: tools/release.sh

      - name: C hook process proof
        env:
          RV_C_HOOK_SKIP_RELEASE: "1"
          RV_RELEASE_STAGE: ${{ github.workspace }}/.build/release-stage
        run: tools/c-hook-proof.sh

      # Linux PR already ran unfiltered swift test. Darwin XPC / LaunchAgent
      # and the isolated-HOME oracle only exist here. Skip the in-process
      # CHookPipeTests proof — this job already ran tools/c-hook-proof.sh.
      - name: Darwin Swift (XPC / CLI)
        run: |
          tools/swift-6.4 test --filter RVServiceTests --skip injectedOneSecondIdleFiresWithoutKeepAlive
          tools/swift-6.4 test --filter RVCLITests --skip CHookPipeTests.cHookProof

      - name: Isolated-HOME oracle
        run: tools/host-oracle.sh

      - name: Isolated-HOME host attach
        env:
          RV_C_HOOK_SKIP_RELEASE: "1"
          RV_RELEASE_STAGE: ${{ github.workspace }}/.build/release-stage
        run: tools/host-attach-proof.sh
