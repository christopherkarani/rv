name: fuzz

# libFuzzer smoke run of each harness (docs/fuzzing.md). Not a required
# check: a finding here gets a regression test and its own fix PR.
on:
  pull_request:
    paths:
      - "Fuzz/**"
      - "Sources/RVIsolation/SecretGateway*.swift"
      - "Sources/RVIsolation/ProcFS*.swift"
      - "Sources/RVIsolation/EgressProxy.swift"
      - "Sources/RVIsolation/EgressAdmission.swift"
      - "Sources/RVMCP/JSONValue*.swift"
      - "Sources/RVMCP/MCPGatewayRuntime.swift"
      - "Sources/RVPolicy/JSON*.swift"
      - "Sources/RVEngine/**"
      - "Sources/RVPacks/**"
      - "Sources/RVDomain/**"
      - "Package.swift"
      - ".github/workflows/fuzz.yml"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: libfuzzer ${{ matrix.harness }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # max_len reaches past each parser's cap: the 64 KiB gateway head,
          # the 16 KiB TLS record (+ split byte), and commandByteCap (65,536).
          # mcp-json spans two of readLines' 64 KiB reads; secret-rewrite
          # holds its whole input layout (1 + 256 + 256 + 1,024 bytes).
          # procfs holds a socket table of a few dozen rows.
          - { harness: gateway-request, dir: GatewayRequest, max_len: 66000, dict: Fuzz/GatewayRequest/http.dict }
          - { harness: tls-client-hello, dir: TLSClientHello, max_len: 17100, dict: "" }
          - { harness: normalize, dir: Normalize, max_len: 70000, dict: Fuzz/Normalize/shell.dict }
          - { harness: mcp-json, dir: MCPJSON, max_len: 140000, dict: Fuzz/MCPJSON/json.dict }
          - { harness: secret-rewrite, dir: SecretRewrite, max_len: 1600, dict: Fuzz/SecretRewrite/rewrite.dict }
          - { harness: procfs, dir: ProcFS, max_len: 4096, dict: Fuzz/ProcFS/procfs.dict }
    env:
      RV_FUZZ: "1"
      # Linux-only leak detection; Fuzz/lsan.supp holds only allocations
      # LSan cannot trace (NSRegularExpression internals), so other leaks
      # still fail the run.
      LSAN_OPTIONS: suppressions=${{ github.workspace }}/Fuzz/lsan.supp:print_suppressions=0
    steps:
      - uses: actions/checkout@v4

      - name: Cache official Swift Linux tarball
        uses: actions/cache@v4
        with:
          path: ~/.local/share/swift
          key: official-swift-${{ hashFiles('.swift-version') }}-ubuntu24.04-${{ runner.arch }}

      - name: Tarball runtime deps (not apt swift)
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            binutils gcc git gnupg2 libc6-dev libcurl4-openssl-dev libedit2 \
            libgcc-13-dev libncurses-dev libpython3-dev libsqlite3-0 libsqlite3-dev \
            libstdc++-13-dev libxml2-dev libz3-dev pkg-config tzdata zip unzip zlib1g-dev

      - name: Install official Swift 6.4 Linux tarball
        run: |
          bin="$(Scripts/install-official-swift-linux.sh --print-bin)"
          echo "$bin" >> "$GITHUB_PATH"

      - name: Build rv-fuzz-${{ matrix.harness }}
        run: |
          swift build --product "rv-fuzz-${{ matrix.harness }}" \
            -Xswiftc -sanitize=fuzzer,address --scratch-path .build/fuzz

      - name: Seed corpus
        env:
          DIR: ${{ matrix.dir }}
        run: |
          mkdir -p corpus artifacts
          if [ -d "Fuzz/$DIR/seeds" ]; then cp Fuzz/"$DIR"/seeds/* corpus/; fi
          if [ "$DIR" = Normalize ]; then
            # One file per `command` string in the gate corpora.
            python3 -I - Tests/RVEngineTests/Fixtures/corpus corpus <<'PY'
          import json, pathlib, sys
          source, out = map(pathlib.Path, sys.argv[1:])
          for name in ["deny", "near-miss", "door-bypass", "agent-parse-stress"]:
              cases = json.loads((source / f"{name}.json").read_text())["cases"]
              for i, case in enumerate(c for c in cases if c.get("command")):
                  (out / f"{name}-{i}").write_text(case["command"])
          PY
          fi
          echo "seed inputs: $(find corpus -type f | wc -l)"

      - name: Fuzz 60 s
        env:
          HARNESS: ${{ matrix.harness }}
          MAX_LEN: ${{ matrix.max_len }}
          DICT: ${{ matrix.dict }}
        run: |
          ".build/fuzz/debug/rv-fuzz-$HARNESS" corpus \
            -max_total_time=60 -timeout=10 -rss_limit_mb=4096 -max_len="$MAX_LEN" \
            ${DICT:+-dict="$DICT"} -artifact_prefix=artifacts/

      - name: Upload crash inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-${{ matrix.harness }}-artifacts
          path: artifacts/
