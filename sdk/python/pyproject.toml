[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rv-sdk"
dynamic = ["version"]
description = "Python SDK for RV: evaluate shell intent against local policy, review approvals, pin rules"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []
keywords = ["rv", "policy", "sandbox", "approvals"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]

[project.urls]
repository = "https://github.com/christopherkarani/rv"
documentation = "https://github.com/christopherkarani/rv/tree/main/sdk/python"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.hatch.version]
path = "src/rv/__init__.py"

[tool.hatch.build.targets.sdist]
packages = ["src/rv"]

[tool.hatch.build.targets.wheel]
packages = ["src/rv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: live tests against a real rvd (needs built binaries)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
